<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#007782">

  <title>ISBN Research</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 430px;

      background: white;
      border-radius: 24px;

      padding: 30px 22px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #777;
      font-size: 15px;
    }

    .camera-container {
      display: none;
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      margin-bottom: 14px;
    }

    #video {
      display: block;
      width: 100%;
      height: auto;
      min-height: 260px;

      object-fit: cover;

      /*
       * Laisse l'iPhone gérer l'autofocus
       * et conserve la caméra arrière.
       */
    }

    .scan-frame {
      position: absolute;

      left: 8%;
      right: 8%;
      top: 35%;
      height: 30%;

      border: 3px solid #00a88f;
      border-radius: 12px;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, 0.25);

      pointer-events: none;
    }

    .scan-line {
      position: absolute;

      left: 10%;
      right: 10%;
      top: 50%;

      height: 2px;

      background: #00d1b2;

      box-shadow:
        0 0 8px #00d1b2;

      animation: scanline 1.8s ease-in-out infinite;
    }

    @keyframes scanline {
      0%, 100% {
        transform: translateY(-35px);
      }

      50% {
        transform: translateY(35px);
      }
    }

    .camera-hint {
      margin: 10px 0 18px;

      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    #isbn {
      display: none;

      margin: 20px 0 8px;

      padding: 16px;

      background: #f2f2f2;
      border-radius: 14px;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    #message {
      min-height: 22px;

      margin-top: 15px;

      color: #666;

      font-size: 14px;
      line-height: 1.4;
    }

    button {
      width: 100%;

      border: none;
      border-radius: 14px;

      padding: 16px 18px;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;

      margin-top: 10px;

      transition: transform .1s;
    }

    button:active {
      transform: scale(.98);
    }

    #scanButton,
    #vintedButton {
      background: #007782;
      color: white;
    }

    #stopButton,
    #newScanButton {
      background: #eeeeee;
      color: #333;
    }

    #stopButton,
    #vintedButton,
    #newScanButton {
      display: none;
    }

    .privacy {
      margin-top: 24px;

      font-size: 12px;
      line-height: 1.4;

      color: #999;
    }
  </style>
</head>


<body>

  <main class="app">

    <div class="logo">📚</div>

    <h1>ISBN Research</h1>

    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>


    <div id="cameraContainer" class="camera-container">

      <video
        id="video"
        playsinline
        muted
        autoplay
      ></video>

      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>

    </div>


    <div id="cameraHint" class="camera-hint" style="display:none;">
      Place le code-barres dans le cadre.<br>
      Évite les reflets et rapproche doucement le livre.
    </div>


    <div id="isbn"></div>


    <button id="scanButton">
      📷 Scanner un livre
    </button>


    <button id="stopButton">
      ✕ Arrêter le scanner
    </button>


    <button id="vintedButton">
      🔎 Rechercher cet ISBN sur Vinted
    </button>


    <button id="newScanButton">
      📷 Scanner un autre livre
    </button>


    <div id="message"></div>


    <div class="privacy">
      Aucun historique ni donnée personnelle n'est enregistré
      par cette application.
    </div>

  </main>


  <!--
    ZXing Browser
    Bibliothèque de lecture de codes-barres
    dans le navigateur.
  -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>


  <script>

    let codeReader = null;
    let controls = null;

    let currentISBN = null;
    let scanning = false;


    const video = document.getElementById("video");

    const cameraContainer =
      document.getElementById("cameraContainer");

    const cameraHint =
      document.getElementById("cameraHint");

    const scanButton =
      document.getElementById("scanButton");

    const stopButton =
      document.getElementById("stopButton");

    const vintedButton =
      document.getElementById("vintedButton");

    const newScanButton =
      document.getElementById("newScanButton");

    const isbnDisplay =
      document.getElementById("isbn");

    const message =
      document.getElementById("message");


    // ==================================================
    // Vérification ISBN-13
    // ==================================================

    function isValidISBN13(isbn) {

      if (!/^\d{13}$/.test(isbn)) {
        return false;
      }

      let sum = 0;

      for (let i = 0; i < 12; i++) {

        const digit = Number(isbn[i]);

        sum += digit * (
          i % 2 === 0 ? 1 : 3
        );
      }

      const checkDigit =
        (10 - (sum % 10)) % 10;

      return checkDigit === Number(isbn[12]);
    }


    // ==================================================
    // Démarrage du scanner
    // ==================================================

    async function startScanner() {

      if (scanning) {
        return;
      }

      scanning = true;
      currentISBN = null;

      isbnDisplay.style.display = "none";
      vintedButton.style.display = "none";
      newScanButton.style.display = "none";

      cameraContainer.style.display = "block";
      cameraHint.style.display = "block";

      scanButton.style.display = "none";
      stopButton.style.display = "block";

      message.textContent =
        "Démarrage de la caméra…";


      try {

        /*
         * On crée un lecteur multi-format,
         * mais on lui indique de privilégier
         * les codes EAN utilisés par les livres.
         */

        const hints = new Map();

        hints.set(
          ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,
          [
            ZXingBrowser.BarcodeFormat.EAN_13,
            ZXingBrowser.BarcodeFormat.EAN_8
          ]
        );


        codeReader =
          new ZXingBrowser.BrowserMultiFormatReader(
            hints
          );


        /*
         * undefined laisse ZXing sélectionner
         * automatiquement la caméra appropriée.
         */

        controls =
          await codeReader.decodeFromConstraints(

            {
              video: {
                facingMode: {
                  ideal: "environment"
                },

                width: {
                  ideal: 1920
                },

                height: {
                  ideal: 1080
                },

                /*
                 * Demande à l'iPhone de privilégier
                 * l'autofocus continu lorsqu'il le permet.
                 */

                focusMode: "continuous"
              }
            },

            video,

            (result, error) => {

              if (!scanning) {
                return;
              }


              if (result) {

                const text =
                  result.getText();

                handleBarcode(text);
              }

            }
          );


        message.textContent =
          "📷 Caméra active — vise le code-barres.";


      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ Impossible d'accéder à la caméra. " +
          "Vérifie l'autorisation dans les réglages de Safari.";

        await stopScanner();
      }
    }


    // ==================================================
    // Traitement du code détecté
    // ==================================================

    async function handleBarcode(text) {

      if (!scanning) {
        return;
      }


      const digits =
        String(text).replace(/\D/g, "");


      /*
       * On accepte uniquement un ISBN-13 valide.
       */

      if (!isValidISBN13(digits)) {

        message.textContent =
          "Code détecté, mais ce n'est pas un ISBN-13.";

        return;
      }


      currentISBN = digits;
      scanning = false;


      await stopScanner();


      isbnDisplay.textContent =
        currentISBN;

      isbnDisplay.style.display =
        "block";


      message.textContent =
        "✅ ISBN détecté !";


      vintedButton.style.display =
        "block";

      newScanButton.style.display =
        "block";
    }


    // ==================================================
    // Arrêter le scanner
    // ==================================================

    async function stopScanner() {

      scanning = false;


      if (controls) {

        try {
          controls.stop();
        } catch (error) {
          console.log(error);
        }

        controls = null;
      }


      if (codeReader) {

        try {
          codeReader.reset();
        } catch (error) {
          console.log(error);
        }

        codeReader = null;
      }


      /*
       * Arrêt explicite du flux caméra.
       */

      if (video.srcObject) {

        const tracks =
          video.srcObject.getTracks();

        tracks.forEach(track => {
          track.stop();
        });

        video.srcObject = null;
      }


      cameraContainer.style.display =
        "none";

      cameraHint.style.display =
        "none";

      stopButton.style.display =
        "none";

      scanButton.style.display =
        "block";
    }


    // ==================================================
    // Recherche Vinted
    // ==================================================

    function searchVinted() {

      if (!currentISBN) {
        return;
      }


      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(currentISBN);


      /*
       * L'ISBN est le SEUL terme envoyé
       * dans la recherche Vinted.
       */

      window.location.href = url;
    }


    // ==================================================
    // Nouveau scan
    // ==================================================

    function newScan() {

      currentISBN = null;

      isbnDisplay.style.display =
        "none";

      vintedButton.style.display =
        "none";

      newScanButton.style.display =
        "none";

      message.textContent = "";

      startScanner();
    }


    // ==================================================
    // Événements
    // ==================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );

    stopButton.addEventListener(
      "click",
      stopScanner
    );

    vintedButton.addEventListener(
      "click",
      searchVinted
    );

    newScanButton.addEventListener(
      "click",
      newScan
    );

  </script>

</body>
</html>
