<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007782">

  <title>ISBN Research</title>

  <link rel="stylesheet" href="style.css">

  <!-- Détection code-barres de secours -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>

  <!-- OCR de secours ultime -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>

  <script src="app.js" defer></script>
</head>

<body>

<main class="app">

  <header class="header">
    <h1>ISBN Research</h1>
    <p>Scanne un livre pour trouver ses annonces</p>
  </header>


  <!-- =========================
       SCANNER
  ========================== -->

  <section class="scanner-card">

    <div id="camera-container" class="camera-container hidden">

      <video
        id="camera-video"
        autoplay
        muted
        playsinline>
      </video>

      <div class="scan-overlay">
        <div class="scan-box">
          <div class="scan-line"></div>
        </div>

        <p>
          Place le code-barres dans le cadre
        </p>
      </div>

    </div>


    <div
      id="scanner-placeholder"
      class="scanner-placeholder">

      <div class="camera-icon">📚</div>

      <strong>Scanner un livre</strong>

      <p>
        Cadre le code-barres dans la zone
      </p>

    </div>


    <button
      id="start-scanner"
      class="primary-button">
      📷 Scanner avec la caméra
    </button>


    <button
      id="capture-button"
      class="capture-button hidden">
      📸 Capturer le code-barres
    </button>


    <button
      id="photo-button"
      class="secondary-button">
      🖼️ Choisir / prendre une photo
    </button>


    <button
      id="stop-scanner"
      class="secondary-button hidden">
      ✕ Arrêter
    </button>


    <input
      id="photo-input"
      type="file"
      accept="image/*"
      capture="environment"
      hidden>

  </section>


  <!-- =========================
       ANALYSE
  ========================== -->

  <section
    id="analysis-card"
    class="analysis-card hidden">

    <div class="spinner"></div>

    <div>
      <strong id="analysis-title">
        Analyse...
      </strong>

      <p id="analysis-text">
        Recherche du code-barres.
      </p>
    </div>

  </section>


  <!-- =========================
       RESULTAT
  ========================== -->

  <section class="result-card">

    <label for="isbn">
      ISBN
    </label>

    <div class="isbn-row">

      <input
        id="isbn"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="978XXXXXXXXXX"
        maxlength="17">

      <button
        id="clear-isbn"
        class="clear-button">
        ×
      </button>

    </div>

    <p
      id="isbn-status"
      class="status">
    </p>


    <button
      id="vinted-search"
      class="vinted-button"
      disabled>
      🔎 Rechercher sur Vinted
    </button>

  </section>


  <!-- =========================
       HISTORIQUE
  ========================== -->

  <section class="history-card">

    <div class="section-title">

      <h2>Derniers scans</h2>

      <button id="clear-history">
        Effacer
      </button>

    </div>

    <div
      id="history"
      class="history-list">
    </div>

  </section>


  <footer>
    ISBN Research · Application personnelle
  </footer>

</main>

</body>
</html>
