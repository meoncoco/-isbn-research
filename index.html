<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#007782"
  >

  <title>ISBN Research</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    body {

      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;

      color: #222;

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(18px, env(safe-area-inset-bottom));
    }


    .app {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 24px;

      padding: 26px 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,.08);

      text-align: center;
    }


    .logo {

      font-size: 48px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size: 27px;
    }


    .subtitle {

      margin: 7px 0 20px;

      color: #777;

      font-size: 15px;
    }


    /* =========================================
       CAMÉRA
       ========================================= */

    #cameraContainer {

      display: none;

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #111;
    }


    #video {

      display: block;

      width: 100%;

      height: 330px;

      object-fit: cover;

      background: #111;
    }


    /*
     * Zone de scan.
     *
     * Beaucoup plus petite que dans la V4.
     *
     * Le but est de rapprocher visuellement
     * le code-barres sans devoir rapprocher
     * physiquement le téléphone.
     */

    .scan-frame {

      position: absolute;

      left: 8%;

      right: 8%;

      top: 38%;

      height: 24%;

      border: 3px solid #00b89c;

      border-radius: 10px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.32);

      pointer-events: none;
    }


    .scan-frame::after {

      content: "";

      position: absolute;

      left: 10%;

      right: 10%;

      top: 50%;

      height: 2px;

      background: #00e0bd;

      box-shadow:
        0 0 10px #00e0bd;

      animation:
        scanLine 1.4s ease-in-out infinite;
    }


    @keyframes scanLine {

      0%,
      100% {
        transform: translateY(-35px);
      }

      50% {
        transform: translateY(35px);
      }
    }


    /* =========================================
       INDICATEUR DE RECHERCHE
       ========================================= */

    .scanning-indicator {

      display: none;

      margin-top: 12px;

      color: #555;

      font-size: 14px;
    }


    .dot {

      display: inline-block;

      width: 7px;

      height: 7px;

      margin-right: 5px;

      border-radius: 50%;

      background: #00a88f;

      animation:
        pulse 1s infinite;
    }


    @keyframes pulse {

      0%,
      100% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }
    }


    /* =========================================
       ZOOM
       ========================================= */

    #zoomControls {

      display: none;

      margin-top: 12px;

      justify-content: center;

      align-items: center;

      gap: 8px;
    }


    .zoomButton {

      width: auto;

      min-width: 48px;

      padding: 10px 12px;

      margin: 0;

      border-radius: 12px;

      background: #eeeeee;

      color: #333;

      font-size: 15px;

      font-weight: 600;
    }


    #zoomValue {

      min-width: 48px;

      font-size: 14px;

      font-weight: 600;

      color: #555;
    }


    /* =========================================
       BOUTONS
       ========================================= */

    button {

      width: 100%;

      border: 0;

      border-radius: 14px;

      padding: 16px;

      margin-top: 10px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;
    }


    button:active {

      transform: scale(.98);
    }


    #scanButton,
    #captureButton,
    #vintedButton {

      background: #007782;

      color: white;
    }


    #stopButton,
    #newScanButton {

      background: #eeeeee;

      color: #333;
    }


    #captureButton,
    #stopButton,
    #vintedButton,
    #newScanButton {

      display: none;
    }


    /* =========================================
       ISBN
       ========================================= */

    #isbn {

      display: none;

      margin: 20px 0 8px;

      padding: 16px;

      background: #f2f2f2;

      border-radius: 14px;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    #message {

      min-height: 22px;

      margin-top: 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.4;
    }


    .privacy {

      margin-top: 22px;

      color: #999;

      font-size: 12px;

      line-height: 1.4;
    }


    #captureCanvas {

      display: none;
    }

  </style>

</head>


<body>


  <main class="app">


    <div class="logo">
      📚
    </div>


    <h1>
      ISBN Research
    </h1>


    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>


    <!-- =========================================
         CAMÉRA
         ========================================= -->

    <div id="cameraContainer">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="scan-frame"></div>


    </div>


    <div
      id="scanningIndicator"
      class="scanning-indicator"
    >

      <span class="dot"></span>

      Recherche automatique…

    </div>


    <!-- =========================================
         ZOOM
         ========================================= -->

    <div id="zoomControls">

      <button
        id="zoomOut"
        class="zoomButton"
      >
        −
      </button>


      <span id="zoomValue">
        1×
      </span>


      <button
        id="zoomIn"
        class="zoomButton"
      >
        +
      </button>

    </div>


    <!-- =========================================
         CANVAS
         ========================================= -->

    <canvas id="captureCanvas"></canvas>


    <!-- =========================================
         ISBN
         ========================================= -->

    <div id="isbn"></div>


    <!-- =========================================
         BOUTONS
         ========================================= -->

    <button id="scanButton">

      📷 Scanner un livre

    </button>


    <!--
      Secours manuel.
      Le scan automatique est prioritaire.
    -->

    <button id="captureButton">

      📸 Capturer maintenant

    </button>


    <button id="stopButton">

      ✕ Arrêter

    </button>


    <button id="vintedButton">

      🔎 Rechercher cet ISBN sur Vinted

    </button>


    <button id="newScanButton">

      📷 Scanner un autre livre

    </button>


    <div id="message"></div>


    <div class="privacy">

      La détection est effectuée
      directement sur ton appareil.

      <br>

      Aucun historique de scans n'est conservé.

    </div>


  </main>


  <!-- =========================================
       HTML5-QRCODE
       ========================================= -->

  <script
    src="https://unpkg.com/html5-qrcode"
  ></script>


  <script>


    // =================================================
    // VARIABLES
    // =================================================

    let stream = null;

    let scanner = null;

    let currentISBN = null;

    let scanning = false;

    let autoScanTimer = null;

    let currentZoom = 1;

    let zoomCapabilities = null;


    // =================================================
    // ÉLÉMENTS
    // =================================================

    const video =
      document.getElementById("video");


    const canvas =
      document.getElementById("captureCanvas");


    const cameraContainer =
      document.getElementById("cameraContainer");


    const scanningIndicator =
      document.getElementById(
        "scanningIndicator"
      );


    const zoomControls =
      document.getElementById(
        "zoomControls"
      );


    const zoomOut =
      document.getElementById(
        "zoomOut"
      );


    const zoomIn =
      document.getElementById(
        "zoomIn"
      );


    const zoomValue =
      document.getElementById(
        "zoomValue"
      );


    const scanButton =
      document.getElementById(
        "scanButton"
      );


    const captureButton =
      document.getElementById(
        "captureButton"
      );


    const stopButton =
      document.getElementById(
        "stopButton"
      );


    const vintedButton =
      document.getElementById(
        "vintedButton"
      );


    const newScanButton =
      document.getElementById(
        "newScanButton"
      );


    const isbnDisplay =
      document.getElementById(
        "isbn"
      );


    const message =
      document.getElementById(
        "message"
      );


    // =================================================
    // ISBN-13
    // =================================================

    function isValidISBN13(isbn) {

      if (!/^\d{13}$/.test(isbn)) {

        return false;
      }


      let sum = 0;


      for (
        let i = 0;
        i < 12;
        i++
      ) {

        const digit =
          Number(isbn[i]);


        sum +=
          digit *
          (
            i % 2 === 0
              ? 1
              : 3
          );
      }


      const checkDigit =
        (10 - (sum % 10)) % 10;


      return (
        checkDigit ===
        Number(isbn[12])
      );
    }


    // =================================================
    // DÉMARRER
    // =================================================

    async function startScanner() {


      if (scanning) {

        return;
      }


      scanning = true;

      currentISBN = null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      cameraContainer.style.display =
        "block";


      scanningIndicator.style.display =
        "block";


      scanButton.style.display =
        "none";


      captureButton.style.display =
        "block";


      stopButton.style.display =
        "block";


      message.textContent =
        "📷 Recherche du code-barres…";


      try {


        /*
         * On conserve la méthode caméra
         * qui fonctionne sur ton iPhone.
         *
         * Pas de résolution forcée.
         */

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                facingMode: {
                  ideal: "environment"
                }

              },

              audio: false

            });


        video.srcObject =
          stream;


        await video.play();


        /*
         * Essai de récupération des capacités
         * de la caméra.
         */

        setupZoom();


        /*
         * Première recherche immédiate.
         */

        scheduleAutoScan();


      } catch (error) {


        console.error(
          "Erreur caméra:",
          error
        );


        message.textContent =
          "❌ Impossible d'accéder à la caméra.";


        await stopScanner();
      }
    }


    // =================================================
    // ZOOM
    // =================================================

    function setupZoom() {


      try {


        const track =
          stream.getVideoTracks()[0];


        zoomCapabilities =
          track.getCapabilities();


        if (
          zoomCapabilities &&
          zoomCapabilities.zoom
        ) {


          zoomControls.style.display =
            "flex";


          currentZoom =
            zoomCapabilities.zoom.min;


          applyZoom();


        } else {


          zoomControls.style.display =
            "none";
        }


      } catch (error) {


        console.log(
          "Zoom non disponible",
          error
        );


        zoomControls.style.display =
          "none";
      }
    }


    async function applyZoom() {


      if (!stream) {

        return;
      }


      const track =
        stream.getVideoTracks()[0];


      if (
        !zoomCapabilities ||
        !zoomCapabilities.zoom
      ) {

        return;
      }


      const min =
        zoomCapabilities.zoom.min;


      const max =
        zoomCapabilities.zoom.max;


      currentZoom =
        Math.max(
          min,
          Math.min(
            max,
            currentZoom
          )
        );


      try {


        await track.applyConstraints({

          advanced: [

            {
              zoom: currentZoom
            }

          ]

        });


        zoomValue.textContent =
          currentZoom.toFixed(1)
            .replace(".0", "") +
          "×";


      } catch (error) {


        console.log(
          "Impossible d'appliquer le zoom",
          error
        );
      }
    }


    zoomOut.addEventListener(
      "click",
      async () => {

        if (
          !zoomCapabilities ||
          !zoomCapabilities.zoom
        ) {

          return;
        }


        currentZoom -=
          0.5;


        await applyZoom();

      }
    );


    zoomIn.addEventListener(
      "click",
      async () => {

        if (
          !zoomCapabilities ||
          !zoomCapabilities.zoom
        ) {

          return;
        }


        currentZoom +=
          0.5;


        await applyZoom();

      }
    );


    // =================================================
    // RECHERCHE AUTOMATIQUE
    // =================================================

    function scheduleAutoScan() {


      if (!scanning) {

        return;
      }


      clearTimeout(
        autoScanTimer
      );


      autoScanTimer =
        setTimeout(
          autoCaptureAndScan,
          700
        );
    }


    // =================================================
    // CAPTURE AUTOMATIQUE
    // =================================================

    async function autoCaptureAndScan() {


      if (
        !scanning ||
        !stream
      ) {

        return;
      }


      /*
       * Vérification de la vidéo.
       */

      if (
        !video.videoWidth ||
        !video.videoHeight
      ) {

        scheduleAutoScan();

        return;
      }


      /*
       * Petite capture de l'image vidéo.
       */

      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext(
          "2d",
          {
            willReadFrequently: true
          }
        );


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * Plusieurs zones sont testées.
       *
       * Cela évite d'être trop dépendant
       * de la position exacte du code-barres.
       */

      const zones = [

        {
          x: 0.05,
          y: 0.25,
          w: 0.90,
          h: 0.50
        },

        {
          x: 0.10,
          y: 0.32,
          w: 0.80,
          h: 0.36
        },

        {
          x: 0.15,
          y: 0.38,
          w: 0.70,
          h: 0.24
        }

      ];


      for (
        const zone of zones
      ) {


        if (!scanning) {

          return;
        }


        const file =
          await createCropFile(
            canvas,
            zone
          );


        if (!file) {

          continue;
        }


        const result =
          await decodeImage(
            file
          );


        if (result) {


          const code =
            String(result)
              .replace(
                /\D/g,
                ""
              );


          /*
           * ISBN-13 valide.
           */

          if (
            code.length === 13 &&
            isValidISBN13(code)
          ) {


            await handleISBN(
              code
            );


            return;
          }
        }
      }


      /*
       * Aucun résultat :
       * on recommence automatiquement.
       */

      scheduleAutoScan();
    }


    // =================================================
    // CRÉATION D'UNE IMAGE RECADRÉE
    // =================================================

    function createCropFile(
      sourceCanvas,
      zone
    ) {


      return new Promise(
        resolve => {


          const x =
            Math.round(
              sourceCanvas.width *
              zone.x
            );


          const y =
            Math.round(
              sourceCanvas.height *
              zone.y
            );


          const w =
            Math.round(
              sourceCanvas.width *
              zone.w
            );


          const h =
            Math.round(
              sourceCanvas.height *
              zone.h
            );


          /*
           * On agrandit la zone.
           */

          const scale =
            2.5;


          const cropCanvas =
            document.createElement(
              "canvas"
            );


          cropCanvas.width =
            Math.round(
              w * scale
            );


          cropCanvas.height =
            Math.round(
              h * scale
            );


          const ctx =
            cropCanvas.getContext(
              "2d"
            );


          ctx.imageSmoothingEnabled =
            false;


          ctx.drawImage(

            sourceCanvas,

            x,
            y,
            w,
            h,

            0,
            0,

            cropCanvas.width,
            cropCanvas.height

          );


          cropCanvas.toBlob(

            blob => {


              if (!blob) {

                resolve(null);

                return;
              }


              resolve(

                new File(

                  [blob],

                  "scan.jpg",

                  {
                    type:
                      "image/jpeg"
                  }

                )

              );

            },

            "image/jpeg",

            0.98

          );

        }
      );
    }


    // =================================================
    // DÉCODAGE IMAGE
    // =================================================

    async function decodeImage(
      file
    ) {


      let readerElement =
        document.getElementById(
          "readerForImage"
        );


      if (!readerElement) {


        readerElement =
          document.createElement(
            "div"
          );


        readerElement.id =
          "readerForImage";


        readerElement.style.display =
          "none";


        document.body.appendChild(
          readerElement
        );
      }


      let reader = null;


      try {


        reader =
          new Html5Qrcode(
            "readerForImage"
          );


        /*
         * Analyse locale.
         */

        const result =
          await reader.scanFile(
            file,
            false
          );


        try {

          reader.clear();

        } catch (e) {}


        return result;


      } catch (error) {


        try {

          if (reader) {

            reader.clear();

          }

        } catch (e) {}


        return null;
      }
    }


    // =================================================
    // CAPTURE MANUELLE
    // =================================================

    async function captureManual() {


      if (!scanning) {

        return;
      }


      message.textContent =
        "📸 Analyse…";


      /*
       * Même moteur que le scan automatique,
       * mais on force immédiatement une analyse.
       */

      clearTimeout(
        autoScanTimer
      );


      await autoCaptureAndScan();


      if (scanning) {

        message.textContent =
          "🔎 Rien trouvé. " +
          "Ajuste légèrement la distance ou le zoom.";
      }
    }


    // =================================================
    // ISBN TROUVÉ
    // =================================================

    async function handleISBN(
      isbn
    ) {


      if (!scanning) {

        return;
      }


      currentISBN =
        isbn;


      scanning =
        false;


      clearTimeout(
        autoScanTimer
      );


      await stopScanner();


      isbnDisplay.textContent =
        currentISBN;


      isbnDisplay.style.display =
        "block";


      message.textContent =
        "✅ ISBN trouvé !";


      vintedButton.style.display =
        "block";


      newScanButton.style.display =
        "block";
    }


    // =================================================
    // ARRÊTER
    // =================================================

    async function stopScanner() {


      scanning =
        false;


      clearTimeout(
        autoScanTimer
      );


      if (stream) {


        const tracks =
          stream.getTracks();


        tracks.forEach(
          track => track.stop()
        );


        stream =
          null;
      }


      video.srcObject =
        null;


      cameraContainer.style.display =
        "none";


      scanningIndicator.style.display =
        "none";


      zoomControls.style.display =
        "none";


      captureButton.style.display =
        "none";


      stopButton.style.display =
        "none";


      scanButton.style.display =
        "block";
    }


    // =================================================
    // VINTED
    // =================================================

    function searchVinted() {


      if (!currentISBN) {

        return;
      }


      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(
          currentISBN
        );


      window.location.href =
        url;
    }


    // =================================================
    // NOUVEAU SCAN
    // =================================================

    function newScan() {


      currentISBN =
        null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      message.textContent =
        "";


      startScanner();
    }


    // =================================================
    // ÉVÉNEMENTS
    // =================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );


    captureButton.addEventListener(
      "click",
      captureManual
    );


    stopButton.addEventListener(
      "click",
      stopScanner
    );


    vintedButton.addEventListener(
      "click",
      searchVinted
    );


    newScanButton.addEventListener(
      "click",
      newScan
    );


  </script>

</body>

</html>
