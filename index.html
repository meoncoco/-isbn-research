<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#007782" />
  <meta name="description" content="Scanner un ISBN et rechercher automatiquement sur Vinted." />

  <title>ISBN → Vinted</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Scanner code-barres / QR -->
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <script src="app.js" defer></script>
</head>

<body>

  <main class="app">

    <header class="header">
      <div>
        <h1>ISBN → Vinted</h1>
        <p>Scanne le code-barres d'un livre</p>
      </div>
    </header>

    <section class="scanner-card">

      <div id="reader"></div>

      <div id="scanner-placeholder" class="scanner-placeholder">
        <div class="camera-icon">📷</div>
        <p>La caméra n'est pas encore activée</p>
      </div>

      <button id="start-scanner" class="primary-button">
        📷 Scanner un livre
      </button>

      <button id="stop-scanner" class="secondary-button hidden">
        ✕ Arrêter le scanner
      </button>

    </section>

    <section class="result-card">

      <label for="isbn">ISBN</label>

      <div class="isbn-row">
        <input
          id="isbn"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="978XXXXXXXXXX"
          maxlength="17"
        />

        <button id="clear-isbn" class="clear-button" aria-label="Effacer">
          ×
        </button>
      </div>

      <p id="isbn-status" class="status"></p>

      <button id="vinted-search" class="vinted-button">
        🔎 Rechercher sur Vinted
      </button>

    </section>

    <section class="history-card">

      <div class="section-title">
        <h2>Derniers scans</h2>
        <button id="clear-history">Effacer</button>
      </div>

      <div id="history" class="history-list">
        <p class="empty-history">Aucun scan pour le moment.</p>
      </div>

    </section>

    <footer>
      <p>ISBN Scanner · Application personnelle</p>
    </footer>

  </main>

</body>
</html>
