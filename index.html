<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#007782">

  <title>ISBN Research</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
    }


    .app {
      width: 100%;
      max-width: 430px;

      background: white;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, .08);

      text-align: center;
    }


    .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }


    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 700;
    }


    .subtitle {
      margin: 8px 0 22px;

      color: #777;

      font-size: 15px;
    }


    /* ================================================
       CAMÉRA
       ================================================ */

    #cameraContainer {

      display: none;

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #111;

      margin-bottom: 12px;
    }


    #video {

      display: block;

      width: 100%;

      height: 300px;

      object-fit: cover;

      background: #111;
    }


    /*
     * Cadre de visée.
     *
     * Il est volontairement horizontal,
     * comme les codes-barres ISBN.
     */

    .scan-frame {

      position: absolute;

      left: 6%;
      right: 6%;

      top: 35%;

      height: 30%;

      border: 3px solid #00a88f;

      border-radius: 10px;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, .25);

      pointer-events: none;
    }


    .scan-line {

      position: absolute;

      left: 3%;
      right: 3%;

      top: 50%;

      height: 2px;

      background: #00d1b2;

      box-shadow:
        0 0 8px #00d1b2;

      animation:
        scanLine 1.8s ease-in-out infinite;
    }


    @keyframes scanLine {

      0%,
      100% {
        transform: translateY(-35px);
      }

      50% {
        transform: translateY(35px);
      }
    }


    .camera-hint {

      display: none;

      margin: 10px 0 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.45;
    }


    /* ================================================
       BOUTONS
       ================================================ */

    button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 16px 18px;

      margin-top: 10px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;

      transition:
        transform .1s,
        opacity .2s;
    }


    button:active {
      transform: scale(.98);
    }


    #scanButton,
    #captureButton,
    #vintedButton {

      background: #007782;

      color: white;
    }


    #stopButton,
    #newScanButton {

      background: #eeeeee;

      color: #333;
    }


    #captureButton,
    #stopButton,
    #vintedButton,
    #newScanButton {

      display: none;
    }


    /* ================================================
       RÉSULTAT
       ================================================ */

    #isbn {

      display: none;

      margin: 20px 0 8px;

      padding: 16px;

      background: #f2f2f2;

      border-radius: 14px;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    #message {

      min-height: 22px;

      margin-top: 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.4;
    }


    .privacy {

      margin-top: 24px;

      color: #999;

      font-size: 12px;

      line-height: 1.4;
    }


    /*
     * Canvas invisible servant à capturer
     * une image de la caméra.
     */

    #captureCanvas {

      display: none;
    }

  </style>
</head>


<body>

  <main class="app">


    <div class="logo">
      📚
    </div>


    <h1>
      ISBN Research
    </h1>


    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>


    <!-- ============================================
         CAMÉRA
         ============================================ -->

    <div
      id="cameraContainer"
    >

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <div
      id="cameraHint"
      class="camera-hint"
    >

      Fais la mise au point sur le code-barres,
      puis appuie sur <strong>Capturer</strong>.

    </div>


    <!--
      Canvas invisible.

      Il sert à prendre une photo du flux vidéo.
    -->

    <canvas
      id="captureCanvas"
    ></canvas>


    <!-- ============================================
         ISBN
         ============================================ -->

    <div id="isbn"></div>


    <!-- ============================================
         BOUTONS
         ============================================ -->

    <button id="scanButton">
      📷 Scanner un livre
    </button>


    <button id="captureButton">
      📸 Capturer le code-barres
    </button>


    <button id="stopButton">
      ✕ Arrêter le scanner
    </button>


    <button id="vintedButton">
      🔎 Rechercher cet ISBN sur Vinted
    </button>


    <button id="newScanButton">
      📷 Scanner un autre livre
    </button>


    <div id="message"></div>


    <div class="privacy">

      La photo est analysée localement
      et n'est pas envoyée à un serveur.

    </div>

  </main>


  <!--
    html5-qrcode

    La bibliothèque permet également
    de scanner une image locale.
  -->

  <script
    src="https://unpkg.com/html5-qrcode">
  </script>


  <script>


    // ==================================================
    // VARIABLES
    // ==================================================

    let stream = null;

    let scanner = null;

    let currentISBN = null;

    let scanning = false;


    // ==================================================
    // ÉLÉMENTS HTML
    // ==================================================

    const video =
      document.getElementById("video");


    const canvas =
      document.getElementById("captureCanvas");


    const cameraContainer =
      document.getElementById("cameraContainer");


    const cameraHint =
      document.getElementById("cameraHint");


    const scanButton =
      document.getElementById("scanButton");


    const captureButton =
      document.getElementById("captureButton");


    const stopButton =
      document.getElementById("stopButton");


    const vintedButton =
      document.getElementById("vintedButton");


    const newScanButton =
      document.getElementById("newScanButton");


    const isbnDisplay =
      document.getElementById("isbn");


    const message =
      document.getElementById("message");


    // ==================================================
    // ISBN-13
    // ==================================================

    function isValidISBN13(isbn) {

      if (!/^\d{13}$/.test(isbn)) {
        return false;
      }


      let sum = 0;


      for (let i = 0; i < 12; i++) {

        const digit =
          Number(isbn[i]);


        sum +=
          digit *
          (i % 2 === 0 ? 1 : 3);
      }


      const checkDigit =
        (10 - (sum % 10)) % 10;


      return (
        checkDigit ===
        Number(isbn[12])
      );
    }


    // ==================================================
    // DÉMARRER LA CAMÉRA
    // ==================================================

    async function startScanner() {


      if (scanning) {
        return;
      }


      scanning = true;

      currentISBN = null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      cameraContainer.style.display =
        "block";


      cameraHint.style.display =
        "block";


      scanButton.style.display =
        "none";


      captureButton.style.display =
        "block";


      stopButton.style.display =
        "block";


      message.textContent =
        "Démarrage de la caméra…";


      try {


        /*
         * Demande classique de caméra arrière.
         *
         * Pas de résolution forcée :
         * on laisse l'iPhone choisir
         * les meilleures capacités disponibles.
         */

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              }

            },

            audio: false

          });


        video.srcObject =
          stream;


        await video.play();


        message.textContent =
          "📷 Fais la mise au point sur le code-barres.";


      } catch (error) {


        console.error(
          "Erreur caméra :",
          error
        );


        message.textContent =
          "❌ Impossible d'accéder à la caméra.";


        await stopScanner();
      }
    }


    // ==================================================
    // CAPTURE D'UNE IMAGE
    // ==================================================

    async function captureBarcode() {


      if (!stream || !scanning) {
        return;
      }


      message.textContent =
        "📸 Analyse de l'image…";


      /*
       * Petite pause.

       * Elle laisse à l'iPhone une fraction
       * de seconde supplémentaire pour terminer
       * sa mise au point avant la capture.
       */

      await new Promise(
        resolve => setTimeout(resolve, 250)
      );


      /*
       * Résolution réelle de la vidéo.
       */

      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      if (!width || !height) {

        message.textContent =
          "❌ Impossible de capturer l'image.";

        return;
      }


      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext("2d");


      /*
       * Capture de l'image.
       */

      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * Conversion en JPEG local.
       */

      canvas.toBlob(

        async function(blob) {

          if (!blob) {

            message.textContent =
              "❌ Impossible de créer l'image.";

            return;
          }


          const file =
            new File(
              [blob],
              "isbn-capture.jpg",
              {
                type: "image/jpeg"
              }
            );


          await analyseImage(file);

        },

        "image/jpeg",

        0.95

      );
    }


    // ==================================================
    // ANALYSE DE L'IMAGE
    // ==================================================

    async function analyseImage(file) {


      try {


        /*
         * Création d'un scanner temporaire.

         * L'analyse est réalisée dans le navigateur.
         */

        scanner =
          new Html5Qrcode(
            "readerForImage"
          );


      } catch (error) {

        /*
         * Le conteneur n'existe pas encore.
         *
         * On le crée ici.
         */

        const div =
          document.createElement("div");


        div.id =
          "readerForImage";


        div.style.display =
          "none";


        document.body.appendChild(div);


        scanner =
          new Html5Qrcode(
            "readerForImage"
          );
      }


      try {


        const result =
          await scanner.scanFile(
            file,
            false
          );


        const isbn =
          String(result)
            .replace(/\D/g, "");


        if (
          isbn.length === 13 &&
          isValidISBN13(isbn)
        ) {


          currentISBN =
            isbn;


          message.textContent =
            "✅ ISBN détecté !";


          isbnDisplay.textContent =
            isbn;


          isbnDisplay.style.display =
            "block";


          vintedButton.style.display =
            "block";


          newScanButton.style.display =
            "block";


          return;
        }


        message.textContent =
          "⚠️ Code trouvé, mais ce n'est pas un ISBN-13 valide.";


      } catch (error) {


        console.log(
          "Aucun code détecté dans l'image.",
          error
        );


        message.textContent =
          "❌ Code non détecté. " +
          "Rapproche le livre, fais la mise au point " +
          "et réessaie.";
      }


      /*
       * Nettoyage du scanner d'image.
       */

      try {

        scanner.clear();

      } catch (error) {

        console.log(error);
      }


      scanner =
        null;
    }


    // ==================================================
    // ARRÊTER LA CAMÉRA
    // ==================================================

    async function stopScanner() {


      scanning =
        false;


      if (stream) {


        const tracks =
          stream.getTracks();


        tracks.forEach(
          track => track.stop()
        );


        stream =
          null;
      }


      video.srcObject =
        null;


      cameraContainer.style.display =
        "none";


      cameraHint.style.display =
        "none";


      captureButton.style.display =
        "none";


      stopButton.style.display =
        "none";


      scanButton.style.display =
        "block";
    }


    // ==================================================
    // RECHERCHE VINTED
    // ==================================================

    function searchVinted() {


      if (!currentISBN) {
        return;
      }


      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(currentISBN);


      window.location.href =
        url;
    }


    // ==================================================
    // NOUVEAU SCAN
    // ==================================================

    function newScan() {


      currentISBN =
        null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      message.textContent =
        "";


      startScanner();
    }


    // ==================================================
    // BOUTONS
    // ==================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );


    captureButton.addEventListener(
      "click",
      captureBarcode
    );


    stopButton.addEventListener(
      "click",
      stopScanner
    );


    vintedButton.addEventListener(
      "click",
      searchVinted
    );


    newScanButton.addEventListener(
      "click",
      newScan
    );

  </script>

</body>
</html>
