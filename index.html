<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#007782">

  <title>ISBN Research</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 430px;

      background: white;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, .08);

      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;

      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin: 8px 0 22px;

      color: #777;

      font-size: 15px;
    }


    /* ================================================
       CAMÉRA
       ================================================ */

    #cameraContainer {

      display: none;

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #111;

      margin-bottom: 12px;
    }

    #video {

      display: block;

      width: 100%;

      height: 300px;

      object-fit: cover;

      background: #111;
    }


    /*
     * Zone de visée.
     *
     * IMPORTANT :
     * on prend une zone assez large verticalement.
     * Le recadrage réel sera effectué après la capture.
     */

    .scan-frame {

      position: absolute;

      left: 5%;
      right: 5%;

      top: 30%;

      height: 40%;

      border: 3px solid #00a88f;

      border-radius: 10px;

      box-shadow:
        0 0 0 9999px rgba(0, 0, 0, .25);

      pointer-events: none;
    }

    .scan-line {

      position: absolute;

      left: 3%;
      right: 3%;

      top: 50%;

      height: 2px;

      background: #00d1b2;

      box-shadow:
        0 0 8px #00d1b2;

      animation:
        scanLine 1.8s ease-in-out infinite;
    }

    @keyframes scanLine {

      0%,
      100% {
        transform: translateY(-45px);
      }

      50% {
        transform: translateY(45px);
      }
    }


    .camera-hint {

      display: none;

      margin: 10px 0 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.45;
    }


    /* ================================================
       RÉSULTAT
       ================================================ */

    #isbn {

      display: none;

      margin: 20px 0 8px;

      padding: 16px;

      background: #f2f2f2;

      border-radius: 14px;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    #message {

      min-height: 22px;

      margin-top: 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.4;
    }


    /* ================================================
       BOUTONS
       ================================================ */

    button {

      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 16px 18px;

      margin-top: 10px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }


    #scanButton,
    #captureButton,
    #vintedButton {

      background: #007782;

      color: white;
    }


    #stopButton,
    #newScanButton {

      background: #eeeeee;

      color: #333;
    }


    #captureButton,
    #stopButton,
    #vintedButton,
    #newScanButton {

      display: none;
    }


    .privacy {

      margin-top: 24px;

      color: #999;

      font-size: 12px;

      line-height: 1.4;
    }


    #captureCanvas {

      display: none;
    }

  </style>
</head>


<body>

  <main class="app">


    <div class="logo">
      📚
    </div>


    <h1>
      ISBN Research
    </h1>


    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>


    <!-- CAMÉRA -->

    <div id="cameraContainer">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>

    </div>


    <div
      id="cameraHint"
      class="camera-hint"
    >

      Place le code-barres dans le cadre.<br>

      Fais la mise au point puis appuie sur
      <strong>Capturer</strong>.

    </div>


    <!-- CANVAS INVISIBLE -->

    <canvas id="captureCanvas"></canvas>


    <!-- ISBN -->

    <div id="isbn"></div>


    <!-- BOUTONS -->

    <button id="scanButton">
      📷 Scanner un livre
    </button>


    <button id="captureButton">
      📸 Capturer le code-barres
    </button>


    <button id="stopButton">
      ✕ Arrêter le scanner
    </button>


    <button id="vintedButton">
      🔎 Rechercher cet ISBN sur Vinted
    </button>


    <button id="newScanButton">
      📷 Scanner un autre livre
    </button>


    <div id="message"></div>


    <div class="privacy">

      La photo est analysée localement
      et n'est pas envoyée à un serveur.

    </div>

  </main>


  <!--
    html5-qrcode
  -->

  <script src="https://unpkg.com/html5-qrcode"></script>


  <script>

    let stream = null;

    let scanner = null;

    let currentISBN = null;

    let scanning = false;


    const video =
      document.getElementById("video");


    const canvas =
      document.getElementById("captureCanvas");


    const cameraContainer =
      document.getElementById("cameraContainer");


    const cameraHint =
      document.getElementById("cameraHint");


    const scanButton =
      document.getElementById("scanButton");


    const captureButton =
      document.getElementById("captureButton");


    const stopButton =
      document.getElementById("stopButton");


    const vintedButton =
      document.getElementById("vintedButton");


    const newScanButton =
      document.getElementById("newScanButton");


    const isbnDisplay =
      document.getElementById("isbn");


    const message =
      document.getElementById("message");


    // ==================================================
    // VALIDATION ISBN-13
    // ==================================================

    function isValidISBN13(isbn) {

      if (!/^\d{13}$/.test(isbn)) {
        return false;
      }


      let sum = 0;


      for (let i = 0; i < 12; i++) {

        const digit =
          Number(isbn[i]);


        sum +=
          digit *
          (i % 2 === 0 ? 1 : 3);
      }


      const checkDigit =
        (10 - (sum % 10)) % 10;


      return (
        checkDigit ===
        Number(isbn[12])
      );
    }


    // ==================================================
    // DÉMARRER LA CAMÉRA
    // ==================================================

    async function startScanner() {

      if (scanning) {
        return;
      }


      scanning = true;

      currentISBN = null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      cameraContainer.style.display =
        "block";


      cameraHint.style.display =
        "block";


      scanButton.style.display =
        "none";


      captureButton.style.display =
        "block";


      stopButton.style.display =
        "block";


      message.textContent =
        "Démarrage de la caméra…";


      try {


        /*
         * Même accès caméra que la version
         * qui fonctionnait chez toi.
         */

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              }

            },

            audio: false

          });


        video.srcObject =
          stream;


        await video.play();


        message.textContent =
          "📷 Fais la mise au point sur le code-barres.";


      } catch (error) {


        console.error(
          "Erreur caméra :",
          error
        );


        message.textContent =
          "❌ Impossible d'accéder à la caméra.";


        await stopScanner();
      }
    }


    // ==================================================
    // CAPTURE
    // ==================================================

    async function captureBarcode() {

      if (!stream || !scanning) {
        return;
      }


      message.textContent =
        "📸 Mise au point et capture…";


      /*
       * Petit délai pour laisser
       * l'autofocus terminer son travail.
       */

      await new Promise(
        resolve =>
          setTimeout(resolve, 400)
      );


      const width =
        video.videoWidth;


      const height =
        video.videoHeight;


      if (!width || !height) {

        message.textContent =
          "❌ Impossible de capturer l'image.";

        return;
      }


      /*
       * Image complète.
       */

      canvas.width =
        width;


      canvas.height =
        height;


      const context =
        canvas.getContext("2d");


      context.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      /*
       * ------------------------------------------------
       * RECADRAGE
       * ------------------------------------------------
       *
       * On garde principalement la zone centrale
       * où se trouve le code-barres.
       *
       * On retire une partie des côtés et du haut/bas.
       */

      const cropX =
        Math.round(width * 0.05);


      const cropY =
        Math.round(height * 0.30);


      const cropWidth =
        Math.round(width * 0.90);


      const cropHeight =
        Math.round(height * 0.40);


      const cropCanvas =
        document.createElement("canvas");


      cropCanvas.width =
        cropWidth;


      cropCanvas.height =
        cropHeight;


      const cropContext =
        cropCanvas.getContext("2d");


      cropContext.drawImage(

        canvas,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth,
        cropHeight

      );


      /*
       * On agrandit également la zone recadrée.
       *
       * Cela aide beaucoup lorsque le code-barres
       * est relativement petit dans l'image.
       */

      const enlargedCanvas =
        document.createElement("canvas");


      enlargedCanvas.width =
        cropWidth * 2;


      enlargedCanvas.height =
        cropHeight * 2;


      const enlargedContext =
        enlargedCanvas.getContext("2d");


      enlargedContext.imageSmoothingEnabled =
        false;


      enlargedContext.drawImage(

        cropCanvas,

        0,
        0,
        cropWidth,
        cropHeight,

        0,
        0,
        cropWidth * 2,
        cropHeight * 2

      );


      /*
       * Conversion en image JPEG.
       */

      enlargedCanvas.toBlob(

        async function(blob) {

          if (!blob) {

            message.textContent =
              "❌ Impossible de créer l'image.";

            return;
          }


          const file =
            new File(

              [blob],

              "isbn-capture.jpg",

              {
                type: "image/jpeg"
              }

            );


          await analyseImage(file);

        },

        "image/jpeg",

        0.98

      );
    }


    // ==================================================
    // ANALYSE DE L'IMAGE
    // ==================================================

    async function analyseImage(file) {


      message.textContent =
        "🔎 Lecture du code-barres…";


      /*
       * Crée un conteneur invisible
       * pour html5-qrcode.
       */

      let reader =
        document.getElementById(
          "readerForImage"
        );


      if (!reader) {

        reader =
          document.createElement("div");

        reader.id =
          "readerForImage";

        reader.style.display =
          "none";

        document.body.appendChild(
          reader
        );
      }


      /*
       * Nouveau lecteur.
       */

      try {

        scanner =
          new Html5Qrcode(
            "readerForImage"
          );

      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ Impossible de lancer le lecteur.";

        return;
      }


      try {


        /*
         * Analyse locale de l'image.
         */

        const result =
          await scanner.scanFile(
            file,
            false
          );


        const code =
          String(result)
            .replace(/\D/g, "");


        /*
         * On affiche temporairement
         * ce que le lecteur a réellement trouvé.
         *
         * C'est utile pour notre diagnostic.
         */

        console.log(
          "Code détecté :",
          code
        );


        if (
          code.length === 13 &&
          isValidISBN13(code)
        ) {


          currentISBN =
            code;


          message.textContent =
            "✅ ISBN détecté !";


          isbnDisplay.textContent =
            code;


          isbnDisplay.style.display =
            "block";


          vintedButton.style.display =
            "block";


          newScanButton.style.display =
            "block";


        } else {


          /*
           * Si un EAN est détecté mais
           * n'est pas un ISBN valide,
           * on le signale séparément.
           */

          if (code.length === 13) {

            message.textContent =
              "⚠️ Code EAN détecté : " +
              code +
              " — mais il ne correspond pas à un ISBN valide.";

          } else {

            message.textContent =
              "❌ Code non détecté. " +
              "Rapproche légèrement le livre " +
              "et recommence la capture.";
          }
        }


      } catch (error) {


        console.log(
          "Aucun code détecté :",
          error
        );


        message.textContent =
          "❌ Code non détecté. " +
          "Place bien les barres dans le cadre " +
          "et fais la mise au point avant de capturer.";
      }


      /*
       * Nettoyage.
       */

      try {

        scanner.clear();

      } catch (error) {

        console.log(error);
      }


      scanner =
        null;
    }


    // ==================================================
    // ARRÊTER LA CAMÉRA
    // ==================================================

    async function stopScanner() {

      scanning =
        false;


      if (stream) {

        const tracks =
          stream.getTracks();


        tracks.forEach(
          track => track.stop()
        );


        stream =
          null;
      }


      video.srcObject =
        null;


      cameraContainer.style.display =
        "none";


      cameraHint.style.display =
        "none";


      captureButton.style.display =
        "none";


      stopButton.style.display =
        "none";


      scanButton.style.display =
        "block";
    }


    // ==================================================
    // VINTED
    // ==================================================

    function searchVinted() {

      if (!currentISBN) {
        return;
      }


      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(currentISBN);


      window.location.href =
        url;
    }


    // ==================================================
    // NOUVEAU SCAN
    // ==================================================

    function newScan() {

      currentISBN =
        null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      message.textContent =
        "";


      startScanner();
    }


    // ==================================================
    // ÉVÉNEMENTS
    // ==================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );


    captureButton.addEventListener(
      "click",
      captureBarcode
    );


    stopButton.addEventListener(
      "click",
      stopScanner
    );


    vintedButton.addEventListener(
      "click",
      searchVinted
    );


    newScanButton.addEventListener(
      "click",
      newScan
    );

  </script>

</body>
</html>
