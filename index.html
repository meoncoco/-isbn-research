<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#007782">

  <title>ISBN Research</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;
      color: #222;

      display: flex;
      justify-content: center;
      align-items: center;

      padding:
        max(20px, env(safe-area-inset-top))
        20px
        max(20px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 430px;

      background: white;
      border-radius: 24px;

      padding: 30px 22px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      margin: 8px 0 25px;
      color: #777;
      font-size: 15px;
    }

    #reader {
      width: 100%;
      display: none;
      overflow: hidden;
      border-radius: 18px;
      margin-bottom: 15px;
      background: #111;
    }

    #reader video {
      width: 100% !important;
      border-radius: 18px;
    }

    .scan-zone {
      display: none;
      margin: 5px 0 15px;
      color: #666;
      font-size: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;

      padding: 16px 18px;

      font-size: 17px;
      font-weight: 600;

      cursor: pointer;
      margin-top: 10px;
    }

    button:active {
      transform: scale(0.98);
    }

    #scanButton,
    #vintedButton {
      background: #007782;
      color: white;
    }

    #stopButton,
    #newScanButton {
      background: #eeeeee;
      color: #333;
    }

    #stopButton,
    #vintedButton,
    #newScanButton {
      display: none;
    }

    #isbn {
      display: none;

      margin: 20px 0 5px;

      padding: 16px;

      background: #f2f2f2;
      border-radius: 14px;

      font-size: 21px;
      font-weight: 700;

      letter-spacing: 1px;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;

      color: #666;

      font-size: 14px;
      line-height: 1.4;
    }

    .privacy {
      margin-top: 24px;

      font-size: 12px;
      line-height: 1.4;

      color: #999;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo">📚</div>

    <h1>ISBN Research</h1>

    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>

    <div id="reader"></div>

    <div id="scanZone" class="scan-zone">
      Place le code-barres dans le cadre
    </div>

    <div id="isbn"></div>

    <button id="scanButton">
      📷 Scanner un livre
    </button>

    <button id="stopButton">
      ✕ Arrêter le scanner
    </button>

    <button id="vintedButton">
      🔎 Rechercher cet ISBN sur Vinted
    </button>

    <button id="newScanButton">
      📷 Scanner un autre livre
    </button>

    <div id="message"></div>

    <div class="privacy">
      Aucun historique ni donnée personnelle n'est enregistré
      par cette application.
    </div>

  </main>


  <!-- Lecteur de codes-barres -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <script>

    let scanner = null;
    let currentISBN = null;
    let scanInProgress = false;
    let lastDetectedCode = null;


    const reader = document.getElementById("reader");
    const scanZone = document.getElementById("scanZone");

    const scanButton = document.getElementById("scanButton");
    const stopButton = document.getElementById("stopButton");

    const vintedButton = document.getElementById("vintedButton");
    const newScanButton = document.getElementById("newScanButton");

    const isbnDisplay = document.getElementById("isbn");
    const message = document.getElementById("message");


    // ==================================================
    // Vérification ISBN-13
    // ==================================================

    function isValidISBN13(isbn) {

      if (!/^\d{13}$/.test(isbn)) {
        return false;
      }

      let sum = 0;

      for (let i = 0; i < 12; i++) {

        const digit = Number(isbn[i]);

        sum += digit * (i % 2 === 0 ? 1 : 3);
      }

      const checkDigit = (10 - (sum % 10)) % 10;

      return checkDigit === Number(isbn[12]);
    }


    // ==================================================
    // Conversion EAN-13 commençant par 979/978
    // ==================================================

    function extractISBN(code) {

      const digits = code.replace(/\D/g, "");

      /*
       * Un ISBN-13 est normalement directement
       * représenté par un EAN-13.
       */

      if (digits.length === 13 && isValidISBN13(digits)) {
        return digits;
      }

      /*
       * Certains scanners peuvent éventuellement
       * retourner un ISBN-10.
       *
       * Pour l'instant nous ne l'envoyons pas à Vinted,
       * car notre objectif est la recherche ISBN-13.
       */

      return null;
    }


    // ==================================================
    // Démarrage du scanner
    // ==================================================

    async function startScanner() {

      if (scanInProgress) {
        return;
      }

      scanInProgress = true;
      currentISBN = null;
      lastDetectedCode = null;

      isbnDisplay.style.display = "none";
      vintedButton.style.display = "none";
      newScanButton.style.display = "none";

      reader.style.display = "block";
      scanZone.style.display = "block";

      scanButton.style.display = "none";
      stopButton.style.display = "block";

      message.textContent =
        "Démarrage de la caméra…";

      try {

        scanner = new Html5Qrcode("reader");

        /*
         * IMPORTANT :
         * on utilise simplement "environment"
         * plutôt que { exact: "environment" }.
         *
         * C'est plus compatible avec Safari/iPhone.
         */

        await scanner.start(

          {
            facingMode: "environment"
          },

          {
            fps: 15,

            /*
             * Zone suffisamment grande pour permettre
             * de présenter facilement le livre.
             */
            qrbox: {
              width: 320,
              height: 160
            },

            /*
             * On accepte les deux formats EAN courants.
             */
            formatsToSupport: [
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8
            ],

            rememberLastUsedCamera: true
          },

          handleScan,

          function () {
            // Pas d'erreur affichée ici :
            // une image sans code-barres est normale.
          }

        );

        message.textContent =
          "📷 Caméra active — présente le code-barres du livre.";

      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ Impossible d'utiliser la caméra. " +
          "Vérifie l'autorisation de caméra de cette web-app.";

        await stopScanner();
      }
    }


    // ==================================================
    // Code détecté
    // ==================================================

    async function handleScan(decodedText) {

      if (!scanInProgress) {
        return;
      }

      /*
       * Évite de traiter plusieurs fois exactement
       * le même code.
       */
      if (decodedText === lastDetectedCode) {
        return;
      }

      lastDetectedCode = decodedText;

      const isbn = extractISBN(decodedText);

      if (!isbn) {

        message.textContent =
          "Code détecté, mais ce n'est pas un ISBN-13 valide.";

        return;
      }

      scanInProgress = false;
      currentISBN = isbn;

      await stopScanner();

      isbnDisplay.textContent = isbn;
      isbnDisplay.style.display = "block";

      message.textContent =
        "✅ ISBN détecté !";

      vintedButton.style.display = "block";
      newScanButton.style.display = "block";
    }


    // ==================================================
    // Arrêt du scanner
    // ==================================================

    async function stopScanner() {

      scanInProgress = false;

      if (scanner) {

        try {
          await scanner.stop();
        } catch (error) {
          console.log(error);
        }

        try {
          scanner.clear();
        } catch (error) {
          console.log(error);
        }

        scanner = null;
      }

      reader.style.display = "none";
      scanZone.style.display = "none";

      stopButton.style.display = "none";
      scanButton.style.display = "block";
    }


    // ==================================================
    // Recherche Vinted
    // ==================================================

    function searchVinted() {

      if (!currentISBN) {
        return;
      }

      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(currentISBN);

      window.location.href = url;
    }


    // ==================================================
    // Nouveau scan
    // ==================================================

    function newScan() {

      currentISBN = null;
      lastDetectedCode = null;

      isbnDisplay.style.display = "none";
      vintedButton.style.display = "none";
      newScanButton.style.display = "none";

      message.textContent = "";

      startScanner();
    }


    // ==================================================
    // Boutons
    // ==================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );

    stopButton.addEventListener(
      "click",
      stopScanner
    );

    vintedButton.addEventListener(
      "click",
      searchVinted
    );

    newScanButton.addEventListener(
      "click",
      newScan
    );

  </script>

</body>
</html>
