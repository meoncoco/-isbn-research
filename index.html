<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#007782"
  >

  <title>ISBN Research</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    body {

      margin: 0;

      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f4f4f4;

      color: #222;

      display: flex;

      justify-content: center;

      align-items: center;

      padding:
        max(18px, env(safe-area-inset-top))
        18px
        max(18px, env(safe-area-inset-bottom));
    }


    .app {

      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 24px;

      padding: 26px 20px;

      box-shadow:
        0 10px 40px rgba(0,0,0,.08);

      text-align: center;
    }


    .logo {

      font-size: 48px;

      margin-bottom: 5px;
    }


    h1 {

      margin: 0;

      font-size: 27px;
    }


    .subtitle {

      margin: 7px 0 20px;

      color: #777;

      font-size: 15px;
    }


    /* =========================================
       CAMÉRA
       ========================================= */

    #cameraContainer {

      display: none;

      position: relative;

      width: 100%;

      overflow: hidden;

      border-radius: 18px;

      background: #111;
    }


    #video {

      display: block;

      width: 100%;

      height: 330px;

      object-fit: cover;

      background: #111;
    }


    /*
     * CADRE ISBN
     *
     * Beaucoup plus petit et horizontal.
     *
     * Il sert de guide visuel uniquement.
     */

    .scan-frame {

      position: absolute;

      left: 9%;

      right: 9%;

      top: 40%;

      height: 20%;

      border: 3px solid #00b89c;

      border-radius: 9px;

      box-shadow:
        0 0 0 9999px rgba(0,0,0,.34);

      pointer-events: none;
    }


    .scan-line {

      position: absolute;

      left: 3%;

      right: 3%;

      top: 50%;

      height: 2px;

      background: #00e0bd;

      box-shadow:
        0 0 9px #00e0bd;

      animation:
        scanLine 1.5s ease-in-out infinite;
    }


    @keyframes scanLine {

      0%,
      100% {
        transform: translateY(-25px);
      }

      50% {
        transform: translateY(25px);
      }
    }


    /* =========================================
       MESSAGE
       ========================================= */

    #message {

      min-height: 24px;

      margin-top: 15px;

      color: #666;

      font-size: 14px;

      line-height: 1.4;
    }


    .searching {

      display: none;

      margin-top: 12px;

      color: #555;

      font-size: 14px;
    }


    .dot {

      display: inline-block;

      width: 7px;

      height: 7px;

      margin-right: 5px;

      border-radius: 50%;

      background: #00a88f;

      animation:
        pulse 1s infinite;
    }


    @keyframes pulse {

      0%,
      100% {
        opacity: .3;
      }

      50% {
        opacity: 1;
      }
    }


    /* =========================================
       ZOOM
       ========================================= */

    #zoomControls {

      display: none;

      justify-content: center;

      align-items: center;

      gap: 8px;

      margin-top: 12px;
    }


    .zoomButton {

      width: auto;

      min-width: 46px;

      padding: 9px 12px;

      margin: 0;

      background: #eeeeee;

      color: #333;

      border-radius: 12px;

      font-size: 16px;
    }


    #zoomValue {

      min-width: 45px;

      font-size: 14px;

      font-weight: 600;

      color: #555;
    }


    /* =========================================
       ISBN
       ========================================= */

    #isbn {

      display: none;

      margin: 20px 0 8px;

      padding: 16px;

      background: #f2f2f2;

      border-radius: 14px;

      font-size: 21px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    /* =========================================
       BOUTONS
       ========================================= */

    button {

      width: 100%;

      border: 0;

      border-radius: 14px;

      padding: 16px;

      margin-top: 10px;

      font-size: 17px;

      font-weight: 600;

      cursor: pointer;
    }


    button:active {

      transform: scale(.98);
    }


    #scanButton,
    #vintedButton {

      background: #007782;

      color: white;
    }


    #stopButton,
    #newScanButton {

      background: #eeeeee;

      color: #333;
    }


    #stopButton,
    #vintedButton,
    #newScanButton {

      display: none;
    }


    /* =========================================
       CONFIDENTIALITÉ
       ========================================= */

    .privacy {

      margin-top: 22px;

      color: #999;

      font-size: 12px;

      line-height: 1.4;
    }

  </style>

</head>


<body>


  <main class="app">


    <div class="logo">
      📚
    </div>


    <h1>
      ISBN Research
    </h1>


    <p class="subtitle">
      Scanne le code-barres d'un livre
    </p>


    <!-- =======================================
         CAMÉRA
         ======================================= -->

    <div id="cameraContainer">


      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>


      <div class="scan-frame">

        <div class="scan-line"></div>

      </div>


    </div>


    <div
      id="searching"
      class="searching"
    >

      <span class="dot"></span>

      Recherche du code-barres…

    </div>


    <!-- =======================================
         ZOOM
         ======================================= -->

    <div id="zoomControls">

      <button
        id="zoomOut"
        class="zoomButton"
      >
        −
      </button>


      <span id="zoomValue">
        1×
      </span>


      <button
        id="zoomIn"
        class="zoomButton"
      >
        +
      </button>

    </div>


    <!-- =======================================
         RÉSULTAT
         ======================================= -->

    <div id="isbn"></div>


    <!-- =======================================
         BOUTONS
         ======================================= -->

    <button id="scanButton">

      📷 Scanner un livre

    </button>


    <button id="stopButton">

      ✕ Arrêter

    </button>


    <button id="vintedButton">

      🔎 Rechercher cet ISBN sur Vinted

    </button>


    <button id="newScanButton">

      📷 Scanner un autre livre

    </button>


    <div id="message"></div>


    <div class="privacy">

      Le code-barres est analysé directement
      sur ton appareil.

      <br>

      Aucun historique de scans n'est conservé.

    </div>


  </main>


  <!--
    ZXing Browser

    Moteur de lecture des codes-barres
    directement dans le navigateur.
  -->

  <script
    src="https://unpkg.com/@zxing/browser@latest"
  ></script>


  <script>


    // =================================================
    // VARIABLES
    // =================================================

    let codeReader = null;

    let controls = null;

    let currentISBN = null;

    let scanning = false;

    let zoomCapabilities = null;

    let currentZoom = 1;


    // =================================================
    // ÉLÉMENTS
    // =================================================

    const video =
      document.getElementById("video");


    const cameraContainer =
      document.getElementById(
        "cameraContainer"
      );


    const searching =
      document.getElementById(
        "searching"
      );


    const zoomControls =
      document.getElementById(
        "zoomControls"
      );


    const zoomOut =
      document.getElementById(
        "zoomOut"
      );


    const zoomIn =
      document.getElementById(
        "zoomIn"
      );


    const zoomValue =
      document.getElementById(
        "zoomValue"
      );


    const scanButton =
      document.getElementById(
        "scanButton"
      );


    const stopButton =
      document.getElementById(
        "stopButton"
      );


    const vintedButton =
      document.getElementById(
        "vintedButton"
      );


    const newScanButton =
      document.getElementById(
        "newScanButton"
      );


    const isbnDisplay =
      document.getElementById(
        "isbn"
      );


    const message =
      document.getElementById(
        "message"
      );


    // =================================================
    // VALIDATION ISBN-13
    // =================================================

    function isValidISBN13(isbn) {


      if (
        !/^\d{13}$/.test(isbn)
      ) {

        return false;
      }


      let sum = 0;


      for (
        let i = 0;
        i < 12;
        i++
      ) {


        const digit =
          Number(isbn[i]);


        sum +=
          digit *
          (
            i % 2 === 0
              ? 1
              : 3
          );
      }


      const checkDigit =
        (
          10 -
          (sum % 10)
        ) % 10;


      return (
        checkDigit ===
        Number(isbn[12])
      );
    }


    // =================================================
    // NETTOYAGE DU TEXTE
    // =================================================

    function normalizeBarcode(
      value
    ) {


      if (!value) {

        return null;
      }


      /*
       * On ne garde que les chiffres.
       */

      let code =
        String(value)
          .replace(/\D/g, "");


      /*
       * Certains lecteurs peuvent retourner
       * un ISBN-10.
       *
       * On le convertira plus tard si nécessaire.
       */

      if (
        code.length === 13
      ) {

        return code;
      }


      return null;
    }


    // =================================================
    // DÉMARRER
    // =================================================

    async function startScanner() {


      if (scanning) {

        return;
      }


      scanning =
        true;


      currentISBN =
        null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      cameraContainer.style.display =
        "block";


      searching.style.display =
        "block";


      scanButton.style.display =
        "none";


      stopButton.style.display =
        "block";


      message.textContent =
        "Place le code-barres dans le cadre";


      try {


        /*
         * Nouveau lecteur ZXing.
         */

        codeReader =
          new ZXingBrowser.BrowserMultiFormatReader();


        /*
         * Récupération des caméras.
         */

        const devices =
          await ZXingBrowser
            .BrowserCodeReader
            .listVideoInputDevices();


        if (
          !devices ||
          devices.length === 0
        ) {

          throw new Error(
            "Aucune caméra trouvée"
          );
        }


        /*
         * On cherche prioritairement
         * la caméra arrière.
         */

        let selectedDevice =
          devices.find(
            device =>
              /back|rear|environment|arrière/i
                .test(
                  device.label || ""
                )
          );


        /*
         * Sinon on prend la dernière caméra.
         *
         * Sur beaucoup d'iPhone,
         * la caméra arrière est listée en dernier.
         */

        if (!selectedDevice) {

          selectedDevice =
            devices[devices.length - 1];
        }


        /*
         * Scan continu.
         *
         * ZXing analyse directement le flux vidéo.
         */

        controls =
          await codeReader.decodeFromVideoDevice(

            selectedDevice.deviceId,

            video,

            (
              result,
              error,
              scanControls
            ) => {


              if (!scanning) {

                return;
              }


              /*
               * Un code a été trouvé.
               */

              if (result) {


                console.log(
                  "Code détecté:",
                  result.getText()
                );


                const code =
                  normalizeBarcode(
                    result.getText()
                  );


                /*
                 * ISBN-13 valide.
                 */

                if (
                  code &&
                  isValidISBN13(code)
                ) {


                  handleISBN(
                    code
                  );

                  return;
                }


                /*
                 * Le moteur a trouvé quelque chose
                 * mais ce n'est pas un ISBN valide.
                 */

                console.log(
                  "Code détecté mais ignoré:",
                  result.getText()
                );
              }

            }

          );


        /*
         * Récupération des capacités
         * de la caméra après démarrage.
         */

        setupZoom();


      } catch (error) {


        console.error(
          "Erreur scanner:",
          error
        );


        message.textContent =
          "❌ Impossible de démarrer la caméra.";


        await stopScanner();
      }
    }


    // =================================================
    // ZOOM
    // =================================================

    function setupZoom() {


      try {


        const track =
          video.srcObject
            ?.getVideoTracks()[0];


        if (!track) {

          return;
        }


        zoomCapabilities =
          track.getCapabilities();


        if (
          zoomCapabilities &&
          zoomCapabilities.zoom
        ) {


          currentZoom =
            zoomCapabilities.zoom.min;


          zoomControls.style.display =
            "flex";


          applyZoom();

        }

      } catch (error) {


        console.log(
          "Zoom non disponible",
          error
        );
      }
    }


    async function applyZoom() {


      try {


        const track =
          video.srcObject
            ?.getVideoTracks()[0];


        if (
          !track ||
          !zoomCapabilities ||
          !zoomCapabilities.zoom
        ) {

          return;
        }


        const min =
          zoomCapabilities.zoom.min;


        const max =
          zoomCapabilities.zoom.max;


        currentZoom =
          Math.max(
            min,
            Math.min(
              max,
              currentZoom
            )
          );


        await track.applyConstraints({

          advanced: [

            {
              zoom:
                currentZoom
            }

          ]

        });


        zoomValue.textContent =
          currentZoom
            .toFixed(1)
            .replace(
              ".0",
              ""
            ) +
          "×";


      } catch (error) {


        console.log(
          "Zoom impossible:",
          error
        );
      }
    }


    zoomOut.addEventListener(
      "click",
      async () => {


        if (
          !zoomCapabilities ||
          !zoomCapabilities.zoom
        ) {

          return;
        }


        currentZoom -=
          0.5;


        await applyZoom();

      }
    );


    zoomIn.addEventListener(
      "click",
      async () => {


        if (
          !zoomCapabilities ||
          !zoomCapabilities.zoom
        ) {

          return;
        }


        currentZoom +=
          0.5;


        await applyZoom();

      }
    );


    // =================================================
    // ISBN TROUVÉ
    // =================================================

    async function handleISBN(
      isbn
    ) {


      if (!scanning) {

        return;
      }


      /*
       * Évite les doubles détections.
       */

      scanning =
        false;


      currentISBN =
        isbn;


      /*
       * Arrêt de la caméra.
       */

      await stopScanner();


      /*
       * Affichage.
       */

      isbnDisplay.textContent =
        currentISBN;


      isbnDisplay.style.display =
        "block";


      message.textContent =
        "✅ ISBN trouvé !";


      vintedButton.style.display =
        "block";


      newScanButton.style.display =
        "block";
    }


    // =================================================
    // ARRÊTER
    // =================================================

    async function stopScanner() {


      scanning =
        false;


      searching.style.display =
        "none";


      zoomControls.style.display =
        "none";


      /*
       * Arrêt ZXing.
       */

      try {


        if (controls) {

          controls.stop();

        }

      } catch (error) {

        console.log(error);
      }


      controls =
        null;


      /*
       * Arrêt du lecteur.
       */

      try {


        if (codeReader) {

          codeReader.reset();

        }

      } catch (error) {

        console.log(error);
      }


      codeReader =
        null;


      /*
       * Arrêt explicite des pistes vidéo.
       */

      try {


        if (video.srcObject) {


          video.srcObject
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );
        }


      } catch (error) {

        console.log(error);
      }


      video.srcObject =
        null;


      cameraContainer.style.display =
        "none";


      stopButton.style.display =
        "none";


      scanButton.style.display =
        "block";
    }


    // =================================================
    // VINTED
    // =================================================

    function searchVinted() {


      if (!currentISBN) {

        return;
      }


      const url =
        "https://www.vinted.fr/catalog?search_text=" +
        encodeURIComponent(
          currentISBN
        );


      window.location.href =
        url;
    }


    // =================================================
    // NOUVEAU SCAN
    // =================================================

    function newScan() {


      currentISBN =
        null;


      isbnDisplay.style.display =
        "none";


      vintedButton.style.display =
        "none";


      newScanButton.style.display =
        "none";


      message.textContent =
        "";


      startScanner();
    }


    // =================================================
    // ÉVÉNEMENTS
    // =================================================

    scanButton.addEventListener(
      "click",
      startScanner
    );


    stopButton.addEventListener(
      "click",
      stopScanner
    );


    vintedButton.addEventListener(
      "click",
      searchVinted
    );


    newScanButton.addEventListener(
      "click",
      newScan
    );


  </script>


</body>

</html>
